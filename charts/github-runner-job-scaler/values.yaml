image:
  repository: ghcr.io/k8stooling/github-runner-job-scheduler
  tag: latest
  pullPolicy: IfNotPresent

runner:
  image: actions-runner:latest
  initImage: ghcr.io/k8stooling/github-runner-init:latest
  serviceAccountName: default
  githubSecretName: github-secrets
  githubTokenKey: GITHUB_TOKEN
  githubApiUrl: https://api.github.com
  githubUrl: https://github.vodafone.com

config:
  runnerMapPath: /etc/github-runner-job-scheduler/repo-runner-map.yaml
  repositories: {}


webhook:
  requireSignature: true
  secret:
    create: false
    name: ""
    key: WEBHOOK_SECRET
    value: ""

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

gateway:
  enabled: false
  create: false
  name: ""
  namespace: ""
  gatewayClassName: ""
  listener:
    name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  hostnames: []
  pathPrefix: /

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: github-runner-job-scheduler.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
