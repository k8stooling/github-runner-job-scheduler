{{- if and .Values.gateway.enabled .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  gatewayClassName: {{ required "gateway.gatewayClassName is required when gateway.create=true" .Values.gateway.gatewayClassName }}
  listeners:
    - name: {{ .Values.gateway.listener.name | quote }}
      port: {{ .Values.gateway.listener.port }}
      protocol: {{ .Values.gateway.listener.protocol | quote }}
      allowedRoutes:
{{ toYaml .Values.gateway.listener.allowedRoutes | indent 8 }}
{{- end }}
