apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "github-runner-job-scheduler.serviceAccountName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: scaler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUNNER_MAP_PATH
              value: {{ .Values.config.runnerMapPath | quote }}
            - name: WEBHOOK_SECRET_REQUIRED
              value: {{ ternary "true" "false" .Values.webhook.requireSignature | quote }}
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "github-runner-job-scheduler.webhookSecretName" . }}
                  key: {{ .Values.webhook.secret.key | quote }}
            - name: RUNNER_IMAGE
              value: {{ .Values.runner.image | quote }}
            - name: INIT_CONTAINER_IMAGE
              value: {{ .Values.runner.initImage | quote }}
            - name: SERVICE_ACCOUNT_NAME
              value: {{ .Values.runner.serviceAccountName | quote }}
            - name: GITHUB_SECRET_NAME
              value: {{ .Values.runner.githubSecretName | quote }}
            - name: GITHUB_TOKEN_KEY
              value: {{ .Values.runner.githubTokenKey | quote }}
            - name: GITHUB_API_URL
              value: {{ .Values.runner.githubApiUrl | quote }}
            - name: GITHUB_URL
              value: {{ .Values.runner.githubUrl | quote }}
          volumeMounts:
            - name: repo-runner-map
              mountPath: /etc/github-runner-job-scheduler
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: repo-runner-map
          configMap:
            name: {{ include "github-runner-job-scheduler.fullname" . }}-repo-map
