{{- if .Values.webhook.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-runner-job-scheduler.webhookSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.webhook.secret.key }}: {{ required "webhook.secret.value is required when webhook.secret.create=true" .Values.webhook.secret.value | quote }}
{{- end }}
