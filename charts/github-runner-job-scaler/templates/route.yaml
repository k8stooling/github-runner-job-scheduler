{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{- if .Values.gateway.create -}}{{ include "github-runner-job-scheduler.fullname" . }}{{- else -}}{{ required "gateway.name is required when gateway.enabled=true and gateway.create=false" .Values.gateway.name }}{{- end }}
      {{- if .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
{{ toYaml .Values.gateway.hostnames | indent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | quote }}
      backendRefs:
        - name: {{ include "github-runner-job-scheduler.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
