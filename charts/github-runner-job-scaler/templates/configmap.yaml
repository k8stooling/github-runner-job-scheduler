apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}-repo-map
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  repo-runner-map.yaml: |
    repositories:
{{ toYaml .Values.config.repositories | indent 6 }}
