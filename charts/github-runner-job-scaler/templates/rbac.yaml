apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-runner-job-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "github-runner-job-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "github-runner-job-scheduler.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-runner-job-scheduler.fullname" . }}
