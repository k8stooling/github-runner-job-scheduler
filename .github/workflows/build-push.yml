name: Publish to ghcr.io
on:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  packages: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/k8stooling/github-runner-job-scheduler
          tags: |
            type=raw,value=py${{ matrix.python-version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.python-version == '3.14' }}
            type=ref,event=tag,enable=${{ matrix.python-version == '3.14' }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
